appId: com.2fast.app
productName: 2Fast
copyright: Copyright (c) 2026
asar: true
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - package.json
  - '!dist/**/*.d.ts'
  - '!dist/**/*.tsbuildinfo'

extraResources:
  - from: resources
    to: .
  - from: assets
    to: assets
    filter:
      - 2FAst.png

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: assets/2FAst.png
  category: public.app-category.utilities
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.inherit.plist

win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/2FAst.png
  executableName: 2Fast
  signAndEditExecutable: false

linux:
  target:
    - target: AppImage
      arch: [x64]
  icon: assets/2FAst.png
  category: Utility

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
