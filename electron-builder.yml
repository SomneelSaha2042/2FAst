appId: com.2fast.app
productName: 2Fast
copyright: Copyright (c) 2026
asar: false
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
afterPack: scripts/after-pack.mjs

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - package.json
  - node_modules/**/*
  - '!dist/**/*.d.ts'
  - '!dist/**/*.tsbuildinfo'
  - '!node_modules/.pnpm/**/*'
  - '!node_modules/.modules.yaml'
  - '!node_modules/.package-lock.json'

extraResources:
  - from: assets
    to: assets
    filter:
      - 2FAst.png
      - 2FAst.ico

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: assets/2FAst.png
  category: public.app-category.utilities
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.inherit.plist

win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/2FAst.ico
  executableName: 2Fast

linux:
  target:
    - target: AppImage
      arch: [x64]
  icon: assets/2FAst.png
  category: Utility

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: assets/2FAst.ico
  uninstallerIcon: assets/2FAst.ico
