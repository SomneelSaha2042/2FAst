<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>2Fast - Secure OTP Feed</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        @keyframes scan-line {
            0% { transform: translateY(-100%); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(100%); opacity: 0; }
        }
        .scan-animation {
            animation: scan-line 2s linear infinite;
        }
        .glass-panel {
            background: rgba(5, 20, 36, 0.82);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(65, 71, 81, 0.15);
        }
        .glow-hover:hover {
            border-color: rgba(96, 165, 250, 0.4);
            box-shadow: inset 0 0 10px rgba(96, 165, 250, 0.1);
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(139, 145, 157, 0.2);
            border-radius: 10px;
        }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "inverse-on-surface": "#233143",
                    "on-primary": "#00315d",
                    "surface-container-highest": "#273647",
                    "outline": "#8b919d",
                    "tertiary-container": "#d19900",
                    "surface-variant": "#273647",
                    "background": "#051424",
                    "on-secondary-container": "#aeb9d0",
                    "on-secondary-fixed": "#111c2d",
                    "on-secondary-fixed-variant": "#3c475a",
                    "surface-bright": "#2c3a4c",
                    "on-primary-fixed": "#001c39",
                    "on-tertiary-fixed": "#261900",
                    "on-surface-variant": "#c1c7d3",
                    "on-tertiary-fixed-variant": "#5d4200",
                    "outline-variant": "#414751",
                    "inverse-surface": "#d4e4fa",
                    "primary-fixed-dim": "#a4c9ff",
                    "surface": "#051424",
                    "tertiary-fixed": "#ffdea4",
                    "primary-container": "#60a5fa",
                    "on-primary-fixed-variant": "#004883",
                    "error-container": "#93000a",
                    "on-secondary": "#263143",
                    "inverse-primary": "#0060ac",
                    "surface-container-lowest": "#010f1f",
                    "on-background": "#d4e4fa",
                    "primary": "#a4c9ff",
                    "on-error-container": "#ffdad6",
                    "on-primary-container": "#003a6b",
                    "surface-container": "#122131",
                    "surface-container-high": "#1c2b3c",
                    "on-tertiary": "#412d00",
                    "secondary-fixed": "#d8e3fb",
                    "on-tertiary-container": "#4b3500",
                    "surface-tint": "#a4c9ff",
                    "on-surface": "#d4e4fa",
                    "surface-container-low": "#0d1c2d",
                    "surface-dim": "#051424",
                    "primary-fixed": "#d4e3ff",
                    "error": "#ffb4ab",
                    "secondary-fixed-dim": "#bcc7de",
                    "secondary-container": "#3e495d",
                    "tertiary-fixed-dim": "#fabd34",
                    "secondary": "#bcc7de",
                    "on-error": "#690005",
                    "tertiary": "#fabd34"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "card-padding": "1.25rem",
                    "stack-gap": "1rem",
                    "input-gap": "0.5rem",
                    "window-padding": "1.5rem",
                    "tray-width": "380px"
            },
            "fontSize": {
                    "headline-sm": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                    "body-sm": ["12px", {"lineHeight": "18px", "fontWeight": "400"}],
                    "code-otp": ["20px", {"lineHeight": "24px", "letterSpacing": "0.1em", "fontWeight": "700"}],
                    "title-bar": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600"}],
                    "body-base": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "label-caps": ["11px", {"lineHeight": "16px", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
</head>
<body class="bg-background text-on-surface flex items-center justify-center min-h-screen">
<!-- App Container: Fixed Width for Tray Context -->
<div class="w-[380px] h-[520px] bg-background overflow-hidden relative flex flex-col shadow-2xl">
<!-- Animated Background Layer -->

<!-- TopAppBar (From Shared Components) -->
<header class="fixed top-0 w-full h-8 flex items-center justify-between px-4 bg-surface/80 backdrop-blur-xl border-b border-outline-variant/15 z-50 select-none">
<span class="font-headline-sm text-headline-sm font-bold text-primary">2Fast</span>
<div class="flex items-center gap-2">
<button class="w-8 h-8 flex items-center justify-center rounded hover:bg-surface-container-highest transition-colors text-on-surface-variant">
<span class="material-symbols-outlined text-sm" data-icon="remove">remove</span>
</button>
<button class="w-8 h-8 flex items-center justify-center rounded hover:bg-error/20 hover:text-error transition-colors text-on-surface-variant">
<span class="material-symbols-outlined text-sm" data-icon="close">close</span>
</button>
</div>
</header>
<!-- SideNavBar (From Shared Components - Suppressed logic check: Navigation visible as this is top-level Codes view) -->
<nav class="h-full w-16 fixed left-0 top-8 bg-surface/80 backdrop-blur-xl border-r border-outline-variant/15 flex flex-col items-center py-4 gap-4 z-40">
<button class="w-10 h-10 flex items-center justify-center text-primary bg-primary/10 rounded-lg transition-all duration-200">
<span class="material-symbols-outlined" data-icon="lock_open">lock_open</span>
</button>
<button class="w-10 h-10 flex items-center justify-center text-outline hover:text-on-surface-variant hover:bg-surface-variant/30 rounded-lg transition-all duration-200">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</nav>
<!-- Main Content Area -->
<main class="ml-16 mt-8 flex-1 flex flex-col p-window-padding overflow-y-auto relative">
<!-- Header Section -->
<div class="mb-6">
<h1 class="font-headline-sm text-headline-sm text-primary mb-1">Gmail OTP</h1>
<p class="font-label-caps text-label-caps text-outline uppercase tracking-wider">Authentication Feed</p>
</div>
<!-- Status Card: Inspecting Emails -->
<div class="glass-panel rounded-xl p-card-padding mb-stack-gap relative overflow-hidden">
<div class="flex items-center gap-3">
<div class="relative w-10 h-10 flex items-center justify-center rounded-full bg-primary/10 text-primary">
<span class="material-symbols-outlined" data-icon="mail" style="font-variation-settings: 'FILL' 1;">mail</span>
<!-- Pulsing Glow -->
<div class="absolute inset-0 rounded-full border border-primary/40 animate-ping"></div>
</div>
<div>
<p class="font-body-base text-on-surface">Scanning Feed...</p>
<p class="font-body-sm text-outline">Inspecting latest emails</p>
</div>
</div>
<!-- Neon Progress Bar -->
<div class="mt-4 h-1 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-primary-container transition-all duration-500 ease-out" id="scan-progress" style="width: 45%;"></div>
</div>
</div>
<!-- Latest 5 Scan Section -->
<div class="flex-1 flex flex-col gap-2">
<div class="flex items-center justify-between mb-1">
<span class="font-label-caps text-label-caps text-outline">Latest 5 Scan</span>
<span class="font-label-caps text-label-caps text-primary/60">Live Updates</span>
</div>
<!-- OTP Code Candidates -->
<div class="space-y-2">
<!-- Item 1 (Active/Newest) -->
<div class="glass-panel glow-hover rounded-lg p-3 flex items-center justify-between transition-all group cursor-pointer border-l-2 border-l-primary">
<div class="flex flex-col">
<span class="font-code-otp text-code-otp text-on-surface leading-tight">482 910</span>
<span class="font-body-sm text-outline">2 minutes ago</span>
</div>
<button class="text-primary hover:text-white transition-colors" title="Copy Code">
<span class="material-symbols-outlined text-xl" data-icon="content_copy">content_copy</span>
</button>
</div>
<!-- Item 2 -->
<div class="glass-panel glow-hover rounded-lg p-3 flex items-center justify-between opacity-80 hover:opacity-100 transition-all cursor-pointer">
<div class="flex flex-col">
<span class="font-code-otp text-code-otp text-on-surface-variant leading-tight">105 572</span>
<span class="font-body-sm text-outline">15 minutes ago</span>
</div>
<span class="material-symbols-outlined text-outline" data-icon="history">history</span>
</div>
<!-- Item 3 -->
<div class="glass-panel glow-hover rounded-lg p-3 flex items-center justify-between opacity-60 hover:opacity-100 transition-all cursor-pointer">
<div class="flex flex-col">
<span class="font-code-otp text-code-otp text-on-surface-variant leading-tight">883 201</span>
<span class="font-body-sm text-outline">42 minutes ago</span>
</div>
<span class="material-symbols-outlined text-outline" data-icon="history">history</span>
</div>
<!-- Item 4 -->
<div class="glass-panel glow-hover rounded-lg p-3 flex items-center justify-between opacity-40 hover:opacity-100 transition-all cursor-pointer">
<div class="flex flex-col">
<span class="font-code-otp text-code-otp text-on-surface-variant leading-tight">339 018</span>
<span class="font-body-sm text-outline">1 hour ago</span>
</div>
<span class="material-symbols-outlined text-outline" data-icon="history">history</span>
</div>
<!-- Item 5 -->
<div class="glass-panel glow-hover rounded-lg p-3 flex items-center justify-between opacity-30 hover:opacity-100 transition-all cursor-pointer">
<div class="flex flex-col">
<span class="font-code-otp text-code-otp text-on-surface-variant leading-tight">001 945</span>
<span class="font-body-sm text-outline">3 hours ago</span>
</div>
<span class="material-symbols-outlined text-outline" data-icon="history">history</span>
</div>
</div>
</div>
<!-- Bottom Action -->
<div class="mt-6">
<button class="w-full h-12 bg-primary-container text-on-primary-container font-headline-sm rounded-lg flex items-center justify-center gap-2 hover:brightness-110 active:scale-[0.98] transition-all shadow-lg shadow-primary/20" id="scan-btn">
<span class="material-symbols-outlined" data-icon="sync">sync</span>
                    Scan Again
                </button>
</div>
</main>
</div>
<script>
        // Micro-interactions for the Scan Progress and Button
        const scanBtn = document.getElementById('scan-btn');
        const progressBar = document.getElementById('scan-progress');
        let isScanning = false;

        scanBtn.addEventListener('click', () => {
            if (isScanning) return;
            
            isScanning = true;
            scanBtn.classList.add('opacity-50');
            scanBtn.innerHTML = `<span class="material-symbols-outlined animate-spin" data-icon="sync">sync</span> Scanning...`;
            
            let progress = 0;
            progressBar.style.width = '0%';
            
            const interval = setInterval(() => {
                progress += Math.random() * 15;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    setTimeout(() => {
                        isScanning = false;
                        scanBtn.classList.remove('opacity-50');
                        scanBtn.innerHTML = `<span class="material-symbols-outlined" data-icon="sync">sync</span> Scan Again`;
                        progressBar.style.width = '100%';
                        // Optional: trigger a subtle notification sound or haptic feedback visual
                    }, 500);
                }
                progressBar.style.width = `${progress}%`;
            }, 200);
        });

        // Initialize progress bar with a subtle drift
        setInterval(() => {
            if (!isScanning) {
                const currentWidth = parseFloat(progressBar.style.width);
                if (currentWidth < 98) {
                    progressBar.style.width = (currentWidth + 0.1) + '%';
                }
            }
        }, 1000);
    </script>
</body></html>
