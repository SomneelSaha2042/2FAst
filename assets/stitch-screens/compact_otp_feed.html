<script>
        // Micro-interactions for the Scan Progress and Button
        const scanBtn = document.getElementById('scan-btn');
        const progressBar = document.getElementById('scan-progress');
        let isScanning = false;

        scanBtn.addEventListener('click', () => {
            if (isScanning) return;
            
            isScanning = true;
            scanBtn.classList.add('opacity-50');
            scanBtn.innerHTML = `<span class="material-symbols-outlined text-[16px] animate-spin" data-icon="sync">sync</span> Scanning...`;
            
            let progress = 0;
            progressBar.style.width = '0%';
            
            const interval = setInterval(() => {
                progress += Math.random() * 15;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    setTimeout(() => {
                        isScanning = false;
                        scanBtn.classList.remove('opacity-50');
                        scanBtn.innerHTML = `<span class="material-symbols-outlined text-[16px]" data-icon="sync">sync</span> Scan Again`;
                        progressBar.style.width = '100%';
                        // Optional: trigger a subtle notification sound or haptic feedback visual
                    }, 500);
                }
                progressBar.style.width = `${progress}%`;
            }, 200);
        });

        // Initialize progress bar with a subtle drift
        setInterval(() => {
            if (!isScanning) {
                const currentWidth = parseFloat(progressBar.style.width);
                if (currentWidth < 98) {
                    progressBar.style.width = (currentWidth + 0.1) + '%';
                }
            }
        }, 1000);
    </script>
